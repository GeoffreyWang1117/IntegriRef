[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    network: calls a live registry over the internet; pass/fail depends on whether
        that service is throttling, so these are not a regression signal. Applied
        automatically from the measured list in tests/conftest.py -- do not expect
        to find the decorator in the test source.
    slow: takes long enough that it should be skippable during iteration.
